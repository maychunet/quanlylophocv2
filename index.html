<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản lý lớp học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --font-sans: "Baloo 2", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  --sidebar-bg: #241e4e;
  --sidebar-text: #b7b2d9;
  --accent: #6c5ce7;
  --accent-light: #8e7cf7;
  --bg: #f4f3fc;
  --card-bg: #ffffff;
  --text-dark: #241e4e;
  --text-muted: #8b87a8;
  --star: #f7a400;
  --plus-bg: #d9f5e3;
  --plus-text: #2e9e5b;
  --minus-bg: #ffe2e2;
  --minus-text: #e0554f;
  --danger: #e0554f;
  --gold: #f7b733;
  --motion-quick: 150ms;
  --motion-fast: 250ms;
  --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
}

@layer base {
  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }
  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  h1, h2, h3 {
    text-wrap: balance;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text-dark);
  font-size: 17.5px;
}

#app { display: flex; min-height: 100vh; min-height: 100dvh; }

/* ---------- SIDEBAR ---------- */
#sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  padding: 18px 0;
  display: flex;
  flex-direction: column;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 0 18px 18px; }
.logo .icon {
  width: 32px; height: 32px; border-radius: 50%; background: var(--star);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--sidebar-bg); flex-shrink: 0;
}
.logo span { color: #fff; font-weight: 600; font-size: 15px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 18px; margin: 2px 10px; border-radius: 9px;
  color: var(--sidebar-text); cursor: pointer; font-size: 14px;
  user-select: none; border: none; background: transparent; width: calc(100% - 20px);
  text-align: left; font-family: inherit; transition: background var(--motion-quick) var(--ease-smooth-out), color var(--motion-quick);
}
.nav-item:hover { background: rgba(255,255,255,0.06); }
.nav-item.active {
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  color: #fff; font-weight: 600;
}
.nav-item .n-icon { width: 18px; text-align: center; font-size: 15px; }
.teacher-box {
  margin-top: auto; padding: 14px 18px 0;
  border-top: 1px solid rgba(255,255,255,0.08);
}

/* ---------- CONTENT ---------- */
#content { flex: 1; padding: 22px; min-width: 0; }
.page { display: none; }
.page.active { display: block; }
h1.page-title { font-size: 24px; margin: 0 0 16px; }

.header-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.dropdown-wrap { position: relative; }
.dropdown-btn {
  display: flex; align-items: center; gap: 6px; background: var(--card-bg);
  border: none; border-radius: 9px; padding: 10px 14px; font-size: 16px;
  font-weight: 600; color: var(--text-dark); cursor: pointer; font-family: inherit;
}
.dropdown-menu {
  position: absolute; top: calc(100% + 6px); left: 0; width: 190px;
  background: #fff; border-radius: 10px; box-shadow: 0 8px 24px rgba(36,30,78,0.18);
  padding: 6px; z-index: 20; display: none; max-height: 280px; overflow-y: auto;
}
.dropdown-menu.open { display: block; }
.dropdown-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px;
}
.dropdown-item:hover { background: #f4f3fc; }
.dropdown-item.selected { background: #efecff; font-weight: 600; }

.student-count { font-size: 14.5px; color: var(--text-muted); }
.search-box {
  display: flex; align-items: center; gap: 6px; background: #fff;
  border-radius: 9px; padding: 8px 12px; font-size: 13.5px; flex: 1; max-width: 260px;
}
.search-box input { border: none; outline: none; font-size: 15.5px; width: 100%; background: transparent; font-family: inherit; }
.btn {
  border: none; border-radius: 9px; padding: 10px 15px; font-size: 15.5px;
  font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit;
  transition: background var(--motion-quick) var(--ease-smooth-out), transform var(--motion-quick);
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--accent-light); }
.btn-ghost { background: #fff; color: var(--text-dark); }
.btn-danger { background: #fff; color: var(--danger); border: 1px solid #fbd3d0; }
.btn-danger:hover { background: #fff0ef; }
.btn-sm { padding: 6px 10px; font-size: 12.5px; border-radius: 7px; }
.spacer { flex: 1; }

/* ---------- STUDENT GRID ---------- */
#studentGrid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 16px; }
@media (max-width: 1100px) { #studentGrid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 760px) { #studentGrid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 520px) {
  #studentGrid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  #sidebar { width: 70px; }
  .logo span, .nav-item span.label, .teacher-box { display: none; }
  .nav-item { justify-content: center; padding: 11px 8px; }
}

.s-card {
  position: relative; background: var(--card-bg); border-radius: 16px;
  padding: 16px 14px; text-align: center; border: 1px solid #eeecfb;
}
.s-card .del-btn {
  position: absolute; top: 6px; right: 6px; font-size: 17px; color: #c3bfe0;
  cursor: pointer; line-height: 1; padding: 3px; z-index: 2; background: none; border: none;
}
.s-card .del-btn:hover { color: var(--danger); }
.s-card .group-badge {
  position: absolute; top: 5px; left: 5px; font-size: 12px; background: #efecff;
  color: var(--accent); padding: 3px 7px; border-radius: 7px; font-weight: 600;
}
.s-avatar {
  width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 36px; margin: 0 auto 9px; cursor: pointer;
  background-size: cover; background-position: center;
}
.s-name { font-size: 18px; font-weight: 700; margin: 0 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-role { font-size: 14.5px; color: var(--accent); font-weight: 600; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-rank { font-size: 13.5px; color: var(--text-muted); margin: 0 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-progress-wrap { background: #f0eefb; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 5px; }
.s-progress-bar { background: var(--accent); height: 100%; }
.s-progress-label { font-size: 12.5px; color: var(--text-muted); margin: 0 0 8px; }
.s-stars { font-size: 19px; color: var(--star); margin: 0 0 10px; font-weight: 700; }
.s-actions { display: flex; gap: 7px; margin-bottom: 8px; }
.s-actions button {
  flex: 1; border: none; border-radius: 8px; font-size: 21px; font-weight: 700;
  padding: 8px 0; cursor: pointer; line-height: 1; font-family: inherit;
}
.btn-minus { background: var(--minus-bg); color: var(--minus-text); }
.btn-plus { background: var(--plus-bg); color: var(--plus-text); }
.btn-profile {
  width: 100%; background: #f4f3fc; color: var(--text-dark); border: none;
  border-radius: 8px; font-size: 15px; padding: 9px 0; cursor: pointer; font-weight: 600; font-family: inherit;
}
.btn-profile:hover { background: #efecff; }

.empty-hint { text-align: center; color: var(--text-muted); font-size: 13.5px; padding: 40px 0; }

/* ---------- TỔNG QUAN ---------- */
.banner-box {
  position: relative; border-radius: 16px; overflow: hidden; height: 150px;
  background: linear-gradient(120deg, #efecff, #f4f3fc); border: 2px dashed #d8d3f5;
  display: flex; align-items: center; justify-content: center; margin-bottom: 20px; cursor: pointer;
}
.banner-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.banner-placeholder { text-align: center; color: var(--text-muted); font-size: 13.5px; }
.banner-placeholder .big { font-size: 26px; display: block; margin-bottom: 6px; }
.banner-change-btn {
  position: absolute; bottom: 10px; right: 10px; background: rgba(36,30,78,0.75);
  color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; border: none; cursor: pointer; font-family: inherit;
}

.tq-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
@media (max-width: 900px) { .tq-grid { grid-template-columns: 1fr; } }
.tq-panel { background: #fff; border-radius: 14px; padding: 16px; }
.tq-panel.dark { background: var(--sidebar-bg); }
.tq-panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.tq-panel-title h3 { margin: 0; font-size: 14.5px; }
.tq-panel.dark .tq-panel-title h3 { color: #fff; }
.tq-sub { font-size: 11.5px; color: var(--text-muted); margin: -8px 0 12px; }
.tq-panel.dark .tq-sub { color: var(--sidebar-text); }

.honor-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
@media (max-width: 700px) { .honor-grid { grid-template-columns: repeat(2, 1fr); } }
.honor-card { background: rgba(255,255,255,0.06); border-radius: 11px; padding: 10px 6px; text-align: center; }
.honor-rank-badge {
  width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #fff;
  font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 4px;
}
.honor-avatar {
  width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 22px; margin: 0 auto 4px; background-size: cover; background-position: center;
}
.honor-name { font-size: 11.5px; color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.honor-score { font-size: 11px; color: var(--gold); font-weight: 700; }

.progress-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0eefb; }
.progress-row:last-child { border-bottom: none; }
.pr-avatar {
  width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 21px; flex-shrink: 0; background-size: cover; background-position: center;
}
.pr-name { font-size: 14px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-delta {
  font-size: 13.5px; font-weight: 700; color: var(--plus-text); background: var(--plus-bg);
  padding: 3px 8px; border-radius: 7px; flex-shrink: 0;
}

/* ---------- RANKING ---------- */
.rank-row { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 11px; padding: 10px 14px; margin-bottom: 8px; }
.rank-chart {
  display: flex; align-items: flex-end; justify-content: center; gap: 18px;
  min-height: 300px; padding: 22px 20px; background: #fff; border-radius: 14px;
  flex-wrap: nowrap; overflow-x: auto;
}
.rank-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1; min-width: 84px; max-width: 150px; height: 100%; }
.rank-position {
  font-size: 11px; font-weight: 800; color: #fff; background: var(--accent);
  border-radius: 20px; padding: 3px 10px; margin-bottom: 6px; white-space: nowrap;
}
.rank-position.pos-1 { background: linear-gradient(120deg, #f7b733, #f79400); font-size: 12px; }
.rank-position.pos-2 { background: #a9a9c2; }
.rank-position.pos-3 { background: #d9a066; }
.rank-col-star { font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 6px; }
.rank-col.podium-1 .rank-col-star { font-size: 15.5px; }
.rank-avatar-wrap { position: relative; margin-bottom: 8px; }
.rank-avatar {
  width: 52px; height: 52px; border-radius: 50%; background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center; font-size: 25px;
  border: 3px solid #fff; box-shadow: 0 2px 8px rgba(36,30,78,0.18);
}
.rank-col.podium-1 .rank-avatar {
  width: 68px; height: 68px; font-size: 33px; border: 3px solid var(--gold);
  box-shadow: 0 4px 14px rgba(247,183,51,0.45);
}
.rank-tier-badge {
  position: absolute; bottom: -2px; right: -2px; width: 21px; height: 21px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 11px; background: #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,0.22); background-size: cover; background-position: center; border: 1.5px solid #fff;
}
.rank-col.podium-1 .rank-tier-badge { width: 25px; height: 25px; font-size: 13px; }
.rank-bar-col { width: 100%; border-radius: 10px 10px 0 0; min-height: 22px; }
.rank-col.podium-1 .rank-bar-col { box-shadow: 0 -2px 0 0 var(--gold) inset; }
.rank-col-name { margin-top: 8px; font-size: 12.5px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.rank-col.podium-1 .rank-col-name { font-size: 14.5px; font-weight: 800; }

/* ---------- REWARDS ---------- */
.reward-form {
  display: flex; gap: 8px; flex-wrap: wrap; background: #fff; border-radius: 12px;
  padding: 14px; margin-bottom: 16px; align-items: flex-end;
}
.field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  border: 1px solid #e4e1f5; border-radius: 8px; padding: 8px 10px; font-size: 13.5px;
  outline: none; font-family: inherit; background: #fff; color: var(--text-dark);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
#rewardList { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 22px; }
.reward-card { background: #fff; border-radius: 12px; padding: 12px 14px; position: relative; }
.reward-card .del-btn { position: absolute; top: 8px; right: 8px; font-size: 12px; color: #c3bfe0; cursor: pointer; background: none; border: none; }
.reward-card .del-btn:hover { color: var(--danger); }
.reward-name { font-size: 14px; font-weight: 600; margin: 0 0 4px; padding-right: 16px; }
.reward-cost { font-size: 12.5px; color: var(--star); font-weight: 600; }
.redeem-box { background: #fff; border-radius: 12px; padding: 14px; }
.redeem-box h3 { margin: 0 0 10px; font-size: 14.5px; }

/* ---------- NHÓM ---------- */
#groupGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.group-card { background: #fff; border-radius: 14px; padding: 14px; position: relative; border: 2px solid transparent; }
.group-card.top1 { border-color: var(--gold); }
.group-card .del-btn { position: absolute; top: 10px; right: 10px; font-size: 13px; color: #c3bfe0; cursor: pointer; background: none; border: none; }
.group-card .del-btn:hover { color: var(--danger); }
.group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; padding-right: 16px; }
.group-name { font-size: 14.5px; font-weight: 700; }
.group-total { background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 8px; }
.group-count { font-size: 11.5px; color: var(--text-muted); margin-bottom: 8px; }
.group-member { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.gm-avatar {
  width: 33px; height: 33px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 16px; flex-shrink: 0; background-size: cover; background-position: center;
}
.gm-name { font-size: 13px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gm-stars { font-size: 12.5px; color: var(--star); font-weight: 600; }
.group-edit-btn { margin-top: 10px; width: 100%; }

.checklist { max-height: 280px; overflow-y: auto; border: 1px solid #eeecfb; border-radius: 9px; padding: 6px; }
.checklist-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; font-size: 13px; }
.checklist-item:hover { background: #f4f3fc; }
.checklist-item input { width: 16px; height: 16px; }

/* ---------- HỒ SƠ ---------- */
.profile-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.profile-avatar {
  width: 78px; height: 78px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 39px; flex-shrink: 0; background-size: cover; background-position: center;
}
.profile-rank-badge {
  display: inline-block; background: #efecff; color: var(--accent); font-size: 12.5px;
  font-weight: 700; padding: 3px 9px; border-radius: 7px; margin-top: 3px;
}
.profile-field { margin-bottom: 12px; }
.profile-field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.profile-field input, .profile-field textarea {
  width: 100%; border: 1px solid #e4e1f5; border-radius: 9px; padding: 9px 11px;
  font-size: 13.5px; outline: none; font-family: inherit;
}
.profile-field textarea { height: 64px; resize: vertical; }
.profile-field input:focus, .profile-field textarea:focus { border-color: var(--accent); }

/* ---------- MODAL ---------- */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(36,30,78,0.45);
  align-items: center; justify-content: center; z-index: 50; padding: 16px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }
.modal-box { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 380px; margin: auto; }
.modal-box.wide { max-width: 460px; }
.modal-box h3 { margin: 0 0 4px; font-size: 15.5px; }
.modal-sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 12px; }
.modal-box input[type="text"], .modal-box textarea {
  width: 100%; border: 1px solid #e4e1f5; border-radius: 9px; padding: 10px 12px;
  font-size: 13.5px; outline: none; font-family: inherit;
}
.modal-box textarea { height: 130px; resize: vertical; }
.modal-box input:focus, .modal-box textarea:focus { border-color: var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.avatar-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.avatar-tab {
  padding: 6px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
  background: #f4f3fc; color: var(--text-muted); cursor: pointer; border: none; font-family: inherit;
}
.avatar-tab.active { background: var(--accent); color: #fff; }
.avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.avatar-choice {
  aspect-ratio: 1; border-radius: 11px; display: flex; align-items: center;
  justify-content: center; font-size: 19px; cursor: pointer; border: 2px solid transparent;
  background-size: cover; background-position: center;
}
.avatar-choice.selected { border-color: var(--accent); }
.field-error { color: var(--danger); font-size: 12px; margin-top: 4px; }
.hidden-file-input { display: none; }
.point-popover {
  position: fixed; display: none; background: #fff; border-radius: 10px;
  box-shadow: 0 10px 30px rgba(36,30,78,0.22); z-index: 60; min-width: 220px;
  max-width: 270px; max-height: 280px; overflow-y: auto; padding: 6px;
}
.point-popover.open { display: block; }
.pp-header { font-size: 11.5px; color: var(--text-muted); padding: 6px 8px; font-weight: 600; }
.pp-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; border: none;
  background: transparent; width: 100%; font-family: inherit; text-align: left;
}
.pp-item:hover { background: #f4f3fc; }
.pp-item .pts { font-weight: 700; flex-shrink: 0; }
.pp-empty { padding: 10px 8px; font-size: 12px; color: var(--text-muted); }
.criteria-row {
  display: flex; align-items: center; justify-content: space-between;
  background: #f4f3fc; border-radius: 8px; padding: 7px 10px; margin-bottom: 6px; font-size: 13px;
}
.criteria-row .del-btn { font-size: 12px; color: #c3bfe0; cursor: pointer; background: none; border: none; }
.criteria-row .del-btn:hover { color: var(--danger); }
.criteria-pts { font-weight: 700; }
.criteria-right { display: flex; align-items: center; gap: 10px; }
.avatar-upload-panel { text-align: center; padding: 26px 10px; border: 2px dashed #d8d3f5; border-radius: 12px; }
.avatar-upload-panel p { font-size: 12.5px; color: var(--text-muted); margin: 10px 0 0; }
.avatar-upload-preview {
  width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 12px; background-size: cover;
  background-position: center; background-color: #f4f3fc; display: flex; align-items: center; justify-content: center; font-size: 36px;
}

/* ---------- BADGES ---------- */
.s-avatar-wrap { position: relative; width: 72px; margin: 0 auto 9px; }
.s-avatar-wrap .s-avatar { margin: 0; }
.tier-badge {
  position: absolute; bottom: -2px; right: -2px; width: 27px; height: 27px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 14px; background: #fff;
  box-shadow: 0 1px 4px rgba(36,30,78,0.25); background-size: cover; background-position: center; border: 2px solid #fff;
}
.top-left-badges {
  position: absolute; top: 6px; left: 6px; display: flex; flex-direction: column; gap: 4px; z-index: 2; align-items: flex-start;
}
.ach-badge {
  font-size: 12px; background: #fff3d6; color: #b9791f; padding: 3px 7px; border-radius: 7px;
  font-weight: 700; display: flex; align-items: center; gap: 2px; white-space: nowrap; cursor: pointer;
}
.ach-tooltip {
  position: fixed; display: none; background: #fff; border-radius: 10px;
  box-shadow: 0 10px 30px rgba(36,30,78,0.22); z-index: 60; min-width: 220px;
  max-width: 280px; max-height: 260px; overflow-y: auto; padding: 10px 12px;
}
.ach-tooltip.open { display: block; }
.ach-tooltip-title { font-size: 12.5px; font-weight: 700; color: var(--text-dark); margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid #f0eefb; }
.ach-tooltip-entry { display: flex; gap: 8px; padding: 5px 0; font-size: 12.5px; }
.ach-tooltip-date { color: var(--text-muted); flex-shrink: 0; width: 64px; }
.ach-tooltip-content { flex: 1; color: var(--text-dark); }
.ach-tooltip-more { font-size: 11.5px; color: var(--accent); margin-top: 6px; padding-top: 6px; border-top: 1px solid #f0eefb; text-align: center; }

.badge-settings-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 700px) { .badge-settings-grid { grid-template-columns: repeat(2, 1fr); } }
.badge-settings-item { text-align: center; background: #f8f7fd; border-radius: 12px; padding: 14px 10px; }
.badge-settings-preview {
  width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 8px; background-size: cover;
  background-position: center; display: flex; align-items: center; justify-content: center; font-size: 30px;
}
.badge-settings-name { font-size: 13px; font-weight: 700; margin: 0 0 8px; }
.badge-settings-btns { display: flex; flex-direction: column; gap: 6px; }

.lib-avatar-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin-top: 4px; }
@media (max-width: 900px) { .lib-avatar-grid { grid-template-columns: repeat(5, 1fr); } }
@media (max-width: 520px) { .lib-avatar-grid { grid-template-columns: repeat(4, 1fr); } }
.lib-avatar-item {
  position: relative; aspect-ratio: 1; border-radius: 11px; overflow: hidden;
  background-size: cover; background-position: center; background-color: #f4f3fc;
}
.lib-avatar-item .del-btn {
  position: absolute; top: 2px; right: 2px; font-size: 14px; color: #fff;
  background: rgba(36,30,78,0.55); border-radius: 50%; width: 19px; height: 19px;
  display: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1; border: none;
}
.lib-avatar-item .del-btn:hover { background: var(--danger); }
.lib-avatar-empty { font-size: 12.5px; color: var(--text-muted); padding: 10px 0; }

.ach-add-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: flex-start; }
.ach-add-row input[type="date"] {
  border: 1px solid #e4e1f5; border-radius: 8px; padding: 8px 9px; font-size: 12.5px;
  outline: none; font-family: inherit; width: 130px; flex-shrink: 0;
}
.ach-add-row input[type="text"] {
  flex: 1; border: 1px solid #e4e1f5; border-radius: 8px; padding: 8px 10px;
  font-size: 13px; outline: none; font-family: inherit;
}
.ach-timeline { max-height: 220px; overflow-y: auto; border: 1px solid #eeecfb; border-radius: 10px; padding: 4px 10px; }
.ach-entry { display: flex; align-items: flex-start; gap: 8px; padding: 9px 2px; border-bottom: 1px solid #f0eefb; position: relative; padding-left: 16px; }
.ach-entry:last-child { border-bottom: none; }
.ach-entry::before { content: ""; position: absolute; left: 2px; top: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.ach-entry-date { font-size: 11px; color: var(--text-muted); flex-shrink: 0; width: 78px; padding-top: 1px; }
.ach-entry-content { flex: 1; font-size: 13px; }
.ach-entry .del-btn { font-size: 11px; color: #c3bfe0; cursor: pointer; flex-shrink: 0; background: none; border: none; }
.ach-entry .del-btn:hover { color: var(--danger); }
.ach-empty { font-size: 12px; color: var(--text-muted); padding: 12px 4px; text-align: center; }

.levelup-box { text-align: center; padding: 28px 20px; }
.levelup-emoji { font-size: 52px; margin-bottom: 10px; }
.levelup-badge-preview {
  width: 78px; height: 78px; border-radius: 50%; margin: 0 auto 12px; background-size: cover;
  background-position: center; display: flex; align-items: center; justify-content: center; font-size: 38px;
}
.levelup-title { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
.levelup-sub { font-size: 13.5px; color: var(--text-muted); margin: 0 0 16px; }

/* ---------- GAMES ---------- */
.game-hub {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}
@media (max-width: 720px) {
  .game-hub { grid-template-columns: 1fr; }
}
.game-hub-card {
  background: #fff;
  border: 1px solid #eeecfb;
  border-radius: 20px;
  padding: 28px 24px 24px;
  text-align: left;
  cursor: pointer;
  transition: transform var(--motion-fast) var(--ease-smooth-out), box-shadow var(--motion-fast);
  min-height: 220px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-family: inherit;
  color: var(--text-dark);
}
.game-hub-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 32px rgba(36, 30, 78, 0.12);
}
.game-hub-icon {
  width: 64px; height: 64px; border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 8px;
}
.game-hub-card h2 { margin: 0; font-size: 22px; font-weight: 800; }
.game-hub-card p { margin: 0; color: var(--text-muted); font-size: 14.5px; line-height: 1.45; flex: 1; }
.game-hub-cta { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 8px; }

.game-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.game-back {
  display: inline-flex; align-items: center; gap: 6px; background: #fff;
  border: none; border-radius: 9px; padding: 10px 14px; font-size: 14.5px;
  font-weight: 600; color: var(--text-dark); font-family: inherit;
}

.wheel-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(260px, 0.85fr);
  gap: 18px;
  align-items: start;
}
@media (max-width: 900px) {
  .wheel-layout { grid-template-columns: 1fr; }
}
.wheel-stage {
  background: #fff;
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.wheel-pointer {
  width: 0; height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 22px solid var(--sidebar-bg);
  z-index: 2;
  filter: drop-shadow(0 2px 2px rgba(36,30,78,0.25));
  margin-bottom: -8px;
}
.wheel-canvas-wrap {
  position: relative;
  width: min(420px, 100%);
  aspect-ratio: 1;
}
.wheel-canvas-wrap canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.wheel-center-btn {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 92px; height: 92px; border-radius: 50%;
  background: var(--sidebar-bg); color: #fff;
  border: 6px solid #fff;
  box-shadow: 0 6px 18px rgba(36,30,78,0.28);
  font-family: inherit; font-weight: 800; font-size: 15px;
  z-index: 3;
}
.wheel-center-btn:disabled { opacity: 0.55; }
.wheel-side { display: flex; flex-direction: column; gap: 14px; }
.wheel-panel { background: #fff; border-radius: 16px; padding: 16px; }
.wheel-panel h3 { margin: 0 0 8px; font-size: 15px; }
.wheel-panel textarea {
  width: 100%; min-height: 88px; border: 1px solid #e4e1f5; border-radius: 10px;
  padding: 10px 12px; font-family: inherit; font-size: 14px; resize: vertical; outline: none;
}
.wheel-chip-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto; }
.wheel-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: #f4f3fc; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600;
}
.wheel-chip button {
  background: none; border: none; color: var(--text-muted); font-size: 12px; padding: 0; line-height: 1;
}
.wheel-chip.drawn { background: #efeef6; color: var(--text-muted); text-decoration: line-through; }
.winner-pop {
  text-align: center; padding: 12px 8px 4px;
}
.winner-pop .name {
  font-size: 26px; font-weight: 800; color: var(--accent); margin: 8px 0 4px;
}
.winner-confetti {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 20px;
}

/* Digital timer */
.timer-wrap {
  background: #fff;
  border-radius: 20px;
  padding: 28px 22px 24px;
  max-width: 680px;
  margin: 0 auto;
}
.digit-board {
  background: #1a1638;
  border-radius: 22px;
  padding: 28px 24px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.28);
}
.digit-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.digit-colon {
  font-size: 64px;
  font-weight: 800;
  color: #f7b733;
  line-height: 1;
  padding-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
.digit-colon.blink { animation: colonBlink 1s steps(1) infinite; }
.digit-board.urgent .digit-colon,
.digit-board.urgent .seg-on { color: #ff6b63; fill: #ff6b63; }
.digit-board.finished {
  animation: boardPulse 0.6s ease-in-out 3;
}
.timer-status {
  color: #b7b2d9;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.timer-status.urgent { color: #ff8a84; }
.timer-controls {
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px;
}
.timer-inputs {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px;
}
.timer-field {
  display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
}
.timer-field label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.timer-field input {
  width: 92px; border: 1px solid #e4e1f5; border-radius: 10px;
  padding: 10px 12px; font-size: 20px; font-weight: 700; font-family: inherit;
  text-align: center; outline: none; font-variant-numeric: tabular-nums;
}
.timer-field input:focus { border-color: var(--accent); }
.timer-presets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.preset-chip {
  background: #efecff; color: var(--accent); border: none; border-radius: 999px;
  padding: 6px 12px; font-size: 13px; font-weight: 700; font-family: inherit;
}
.preset-chip:hover { background: #e0dbff; }
.seg-digit { width: 72px; height: 112px; }
.clear-timer { gap: 6px; }
.clear-digit {
  font-size: 88px;
  font-weight: 800;
  color: #F7B733;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: 0.02em;
  min-width: 1.35em;
  text-align: center;
  text-shadow: 0 0 18px rgba(247,183,51,0.35);
}
.clear-digit.urgent { color: #ff6b63; text-shadow: 0 0 18px rgba(255,107,99,0.4); }
.clear-colon { font-size: 72px !important; padding-bottom: 0 !important; }
@media (max-width: 520px) {
  .clear-digit { font-size: 56px; }
  .clear-colon { font-size: 48px !important; }
}
@media (max-width: 520px) {
  .seg-digit { width: 48px; height: 76px; }
  .digit-colon { font-size: 42px; }
  .digit-board { padding: 18px 12px; }
}

@keyframes colonBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0.18; }
}
@keyframes boardPulse {
  0%, 100% { box-shadow: inset 0 0 40px rgba(0,0,0,0.28); }
  50% { box-shadow: inset 0 0 40px rgba(224,85,79,0.45), 0 0 24px rgba(224,85,79,0.35); }
}

@media (prefers-reduced-motion: reduce) {
  .game-hub-card, .btn, .nav-item { transition: none; }
  .digit-colon.blink { animation: none; }
  .digit-board.finished { animation: none; }
}

@media (max-width: 520px) {
  #content { padding: 14px 10px 28px; }
  h1.page-title { font-size: 20px; }
  .header-row .btn { padding: 8px 10px; font-size: 13px; }
}

</style>

  <!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website của bạn</title>
    <style>
        /* CSS cho Footer */
        footer.my-footer {
            width: 100%;
            background-color: #f8f9fa; /* Màu nền trắng xám nhẹ giống hình */
            color: #6c757d;           /* Màu chữ xám vừa phải */
            text-align: center;       /* Căn giữa nội dung */
            padding: 12px 20px;       /* Khoảng cách trên dưới và 2 bên */
            font-size: 14px;          /* Kích thước chữ */
            font-family: Arial, sans-serif;
            border-top: 1px solid #e9ecef; /* Đường viền mỏng phía trên */
            
            /* Cấu hình để luôn dính ở đáy màn hình (Fixed Footer) */
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 1000;
        }

        /* Thêm padding dưới cùng cho body để nội dung trang không bị footer che mất */
        body {
            margin: 0;
            padding-bottom: 50px; 
            background-color: #0d1117; /* Màu nền tối ví dụ giống giao diện của bạn */
        }
    </style>
</head>
<body>

    <!-- Nội dung trang web của bạn ở đây -->

    <!-- Thẻ Footer -->
    <footer class="my-footer">
        © 2026 Tác giả: Nguyễn Thanh Sơn - Trường tiểu học Tăng Nhơn Phú - TP Hồ Chí Minh
    </footer>
</body>
</html>
